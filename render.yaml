services:
  - type: web
    name: my-e-learning-backend
    env: node
    rootDir: backend/courses-pj
    buildCommand: "npm install"
    startCommand: "node app.js"
 
    plan: free
    region: oregon

 #  تغييرات الـ Frontend هنا
  - type: web
    name: my-e-learning-frontend
    env: node
    rootDir: Frontend/E-Learning-main
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    plan: free
    region: oregon
